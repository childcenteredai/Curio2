name: Build and Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push Images to ECR"
        required: false
        default: true
        type: boolean
      deploy:
        description: "Deploy after build"
        required: false
        default: false
        type: boolean

jobs:
  build:
    env:
      IMAGE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-${{ github.event.repository.owner.login }}-${{ github.event.repository.name }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'release' || github.event.inputs.push_images == 'true' }}
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/curio2-backend:latest
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/curio2-backend:${{ env.IMAGE_TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'release' || github.event.inputs.push_images == 'true' }}
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/curio2-frontend:latest
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/curio2-frontend:${{ env.IMAGE_TAG }}

      - name: Export image tag
        id: export_tag
        run: |
          echo "tag=${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

    outputs:
      tag: ${{ steps.export_tag.outputs.tag }}

  deploy:
    if: github.event_name == 'release' || github.event.inputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create helm-charts dispatch token
        id: ci-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CCAI_CI_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.CCAI_CI_DISPATCH_PRIVATE_KEY }}
          owner: childcenteredai
          repositories: helm-charts
          permission-actions: write

      - name: Trigger helm-charts workflow to deploy new image tags
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: |
          UPDATES=$(jq -n -c --arg vf "values-scienceqa.yaml" --arg t "${{ needs.build.outputs.tag }}" '[{values_file: $vf, tag: $t}]')
          PAYLOAD=$(jq -n --arg updates "$UPDATES" '{"ref": "main", "inputs": {"updates": $updates}}')

          curl -f -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/childcenteredai/helm-charts/actions/workflows/update-fullstack-app-image-tags.yaml/dispatches \
            -d "$PAYLOAD"
